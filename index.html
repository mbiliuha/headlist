<html lang="uk">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; img-src 'self' data:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">

<title>Хед-лист</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2b7de9);
    --btn: var(--tg-theme-button-color, #2b7de9);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);

    --sep: rgba(128,128,128,.28);
    --red: #e5484d; --yellow: #f5b400; --blue: #3b82f6; --green: #22a861; --gray: #a0a4ab;   /* крапки й заливки */
    --red-t: #c9343a; --green-t: #18794e; --blue-t: #2563eb; --amber-t: #946200; --call: #18794e;   /* ті самі кольори для тексту (контраст ≥4.5) */

  }
  @supports (color: color-mix(in srgb, red 50%, blue)) {

  }
  :root.dark { --red-t: #ff6b6e; --green-t: #3dd68c; --blue-t: #6ea8ff; --amber-t: #ffc53d; --call: #1a7f55; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text); font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: var(--sab); overscroll-behavior-y: none; }
  body.lock { overflow: hidden; }
  ::placeholder { color: var(--hint); opacity: 1; }
  button, .tab, .chip, a.rcall, a.callbtn { touch-action: manipulation; }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { background: var(--bg); padding: 12px 16px 8px; }
  .tabsbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 12px 8px; border-bottom: 1px solid var(--sep); }
  .row { display: flex; align-items: center; gap: 8px; }
  .who { font-weight: 600; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select { font: inherit; color: var(--text); background: var(--bg2); border: 0; border-radius: 10px; padding: 10px 10px; min-height: 44px; max-width: 60%; }

  .stats::-webkit-scrollbar { display: none; }

  .stat b { font-weight: 700; }
  .stat.bad b { color: var(--red-t); }
  .tabs { display: flex; background: var(--bg2); border-radius: 10px; padding: 3px; }
  .tab { flex: 1; text-align: center; padding: 9px 4px; min-height: 40px; white-space: nowrap; border-radius: 8px; font-size: 15px; font-weight: 500; color: var(--text2); border: 0; background: none; font-family: inherit; }
  .tab.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .banner { margin: 10px 12px 0; background: rgba(43,125,233,.14); background: color-mix(in srgb, var(--btn) 14%, var(--bg)); border-radius: 12px; padding: 10px 12px; font-size: 15px; }

  .item:last-child { border-bottom: 0; }

  .card { background: var(--bg); border-top: 1px solid var(--sep); border-bottom: 1px solid var(--sep); padding: 4px 16px; }

  .field input, textarea { flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent; border: 0; outline: none; padding: 11px 0; text-overflow: ellipsis; }
  .callbtn { flex: none; background: var(--call); color: #fff; border-radius: 999px; padding: 11px 16px; text-decoration: none; font-size: 15px; font-weight: 600; }
  textarea { width: 100%; resize: none; min-height: 64px; padding: 10px 0; }
  .save { display: block; width: calc(100% - 32px); margin: 12px 16px 0; background: var(--btn); color: var(--btn-text); border: 0; border-radius: 12px; padding: 14px 12px; min-height: 48px; font: inherit; font-weight: 600; }
  .save:disabled { opacity: .5; }
  .save:active, .callbtn:active { filter: brightness(.88); }
  .tab:active, .chip:active, .seg button:active, .daynav button:active, .mini:active, .addbtn:active { opacity: .6; }
  .msg { margin: 8px 16px 0; font-size: 14px; color: var(--text2); min-height: 18px; }
  .msg.err { color: var(--red-t); }
  .ev { padding: 10px 0; border-bottom: 1px solid var(--sep); }
  .ev:last-child { border-bottom: 0; }
  .evh { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text2); }
  .evh .dot { margin-top: 0; }
  .evt { font-size: 15px; line-height: 1.4; margin-top: 3px; white-space: pre-wrap; word-wrap: break-word; }
  .evn { font-size: 14px; margin-top: 3px; color: var(--text2); white-space: pre-wrap; word-wrap: break-word; }
  .back { background: none; border: 0; color: var(--link); font: inherit; padding: 0 0 8px; display: none; }
  .noTg .back { display: inline-block; }
  .spin { text-align: center; padding: 40px; color: var(--text2); }
  .tag { font-size: 13px; padding: 1px 7px; border-radius: 999px; background: var(--bg2); color: var(--text2); }
  .tag.edit { background: rgba(34,168,97,.16); color: var(--green-t); }
  .tag.off { text-decoration: line-through; }
  .mini { flex: none; border: 1px solid var(--sep); background: var(--bg); color: var(--red-t); border-radius: 10px; padding: 10px 12px; min-height: 44px; font: inherit; font-size: 14px; }
  .addbtn { display: block; width: calc(100% - 24px); margin: 10px 12px 0; background: var(--bg); color: var(--link); border: 1px dashed var(--sep); border-radius: 12px; padding: 11px; font: inherit; font-weight: 600; }
  .form { background: var(--bg); margin: 10px 12px 0; border-radius: 12px; padding: 4px 14px 12px; }
  .form .field { flex-wrap: wrap; }

  .form select { max-width: none; flex: 1; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 0; }

  .form .save { width: 100%; margin: 10px 0 0; }
  .muted { opacity: .55; }
  .daynav { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; }
  .daynav b { flex: 1; text-align: center; font-size: 16px; }
  .daynav button { border: 1px solid var(--sep); background: var(--bg); color: var(--link); border-radius: 10px; padding: 10px 14px; min-width: 48px; min-height: 44px; font: inherit; font-size: 16px; }
  .daynav button:disabled { opacity: .35; }
  .dsum { margin: 8px 12px 0; font-size: 14px; color: var(--text2); }
  .drow { display: flex; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--sep); cursor: pointer; }
  .drow:active { background: var(--bg2); }
  .drow .tm { flex: none; width: 4.5em; min-width: 62px; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--text2); line-height: 1.3; }
  .drow .tm b { display: block; color: var(--text); font-size: 15px; }
  .drow .tm .dmin { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--link, #2481cc); }
  .drow .bd { flex: 1; min-width: 0; }
  .drow .nm { font-weight: 600; }
  .drow .mt { font-size: 14px; color: var(--text2); margin-top: 2px; }
  .drow .cm { font-size: 14px; line-height: 1.4; margin-top: 3px; }
  .gap { padding: 8px 16px 8px calc(26px + 4.5em); font-size: 14px; font-weight: 600; color: #d32f2f; background: rgba(229,57,53,.12); background: color-mix(in srgb, #e53935 13%, var(--bg)); border-bottom: 1px solid var(--sep); border-left: 4px solid #e53935; }
  .dsum { display: flex; gap: 8px; align-items: flex-start; }
  .dsum .st { flex: 1; min-width: 0; }
  .ord { flex: none; border: 1px solid var(--sep); background: var(--bg); color: var(--link); border-radius: 10px; padding: 6px 10px; min-height: 36px; font: inherit; font-size: 13px; white-space: nowrap; }
  .ord:active { opacity: .6; }
  #offbar { display: none; margin: 8px 0 0; padding: 8px 12px; border-radius: 10px; font-size: 14px; background: rgba(255,149,0,.18); background: color-mix(in srgb, #ff9500 16%, var(--bg)); color: var(--text); }
  #offbar.show { display: block; }
  #offbar button { margin-left: 8px; border: 1px solid var(--sep); background: var(--bg); color: var(--link); border-radius: 8px; padding: 6px 12px; min-height: 36px; font: inherit; font-size: 14px; }
  .reset { display: inline-block; margin-top: 12px; border: 1px solid var(--sep); background: var(--bg); color: var(--link); border-radius: 10px; padding: 10px 16px; min-height: 44px; font: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row"><div class="who" id="who">Хед-лист</div><select id="agentSel" style="display:none"></select></div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="tabsbar">
    <div class="tabs" id="tabs"><button class="tab on" data-tab="tasks">Наработки</button><button class="tab" data-tab="day">День</button><button class="tab" data-tab="all">Усі бізнеси</button><button class="tab" data-tab="admin" id="tabAdmin" style="display:none">Доступи</button></div>
    <div id="offbar"></div>
  </div>
  <div id="main"><div class="spin">Завантаження…</div></div>
</div>

<div id="detail"></div>

<script>
(function () {
  'use strict';
  // адреса Apps Script (веб-додаток бота)
  var API = 'https://script.google.com/macros/s/AKfycbz3pcpvLKDI_dqep5V_RSkmkxvB0Vv4DuGqLpmXa_ECrQNSVabpdt0Ecj5UAvsr6Qn9Yg/exec';
  var tg = window.Telegram && window.Telegram.WebApp;

  var INIT = tg && tg.initData ? tg.initData : '';
  var KEY = '';   // персональний ключ із кнопки бота (Apps Script підставляє його сюди)
  if (!KEY) { var km = location.search.match(/[?&]k=([^&]+)/); if (km) { try { KEY = decodeURIComponent(km[1]); } catch (e) { KEY = ''; } } }
  // ключ не лишаємо в адресному рядку (історія, скріншоти)
  try { if (KEY && history.replaceState) history.replaceState(null, '', location.pathname + (DEMO ? '?demo=1' : '')); } catch (e) {}
  var S = { me: null, agent: null, data: null, tab: 'tasks', q: '', filter: '' };
  var ST = { green: 'Договір', red: 'Відпрацьовано', yellow: 'Думає', blue: 'Зустріч з ЛПР', white: 'Вийти на ЛПР', '': 'Без статусу' };
  function isOpenSt(s) { return s === 'yellow' || s === 'blue' || s === 'white'; }
  var WD = ['нд', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}   // свайп униз не згортає застосунок посеред набору нотатки
    try { tg.setHeaderColor && tg.setHeaderColor('bg_color'); tg.setBackgroundColor && tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
  }
  function scheme() {
    var dark, bgc = tg && tg.themeParams && tg.themeParams.bg_color, m = /^#([0-9a-f]{6})$/i.exec(bgc || '');
    if (m) { var n = parseInt(m[1], 16); dark = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) < 128; }   // найнадійніше — за фактичним кольором фону
    else if (tg && tg.colorScheme) dark = tg.colorScheme === 'dark';
    else dark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches && tg && tg.initData);
    document.documentElement.classList.toggle('dark', dark);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  }
  scheme(); try { tg && tg.onEvent && tg.onEvent('themeChanged', scheme); } catch (e) {}
  if ('serviceWorker' in navigator && !DEMO && /^https/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
  if (!tg || !tg.initData) document.body.classList.add('noTg');
  function initFromHash(h) {
    var m = String(h || '').replace(/^#/, '').split('&').filter(function (kv) { return kv.indexOf('tgWebAppData=') === 0; })[0];
    return m ? decodeURIComponent(m.slice(13)) : '';
  }

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"'`]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]; }); }
  function cls(v) { return /^[a-z]{1,12}$/.test(String(v || '')) ? v : 'none'; }   // значення для CSS-класу — лише відомі слова
  function digits(v) { return String(v || '').replace(/\D/g, ''); }
  function d(dt) { return String(dt || '').slice(0, 10); }
  function t(dt) { return String(dt || '').slice(11, 16); }
  function dm(s) { var a = String(s).split('-'); return a[2] + '.' + a[1]; }
  function wd(s) { var a = s.split('-'); return WD[new Date(Date.UTC(+a[0], +a[1] - 1, +a[2])).getUTCDay()]; }
  function addDays(s, n) { var a = s.split('-'); var x = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2]) + n * 864e5); return x.toISOString().slice(0, 10); }
  // tel: усередині Telegram (особливо iOS) не відкривається — відкриваємо маленьку сторінку call.html у браузері, вона набирає номер
  window.callNum = function (ev, id, p) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    p = digits(p);
    if (!(tg && tg.platform && tg.platform !== 'unknown') || DEMO) { location.href = 'tel:+' + p; return false; }

      var keep = dirty();   // є незбережена нотатка — застосунок не закриваємо

    }).catch(function (e) { try { tg.showAlert(String(e && e.message || '').length > 15 ? e.message : 'Не вдалося. Номер: +' + p); } catch (x) {} });
    return false;
  };
  function phoneFmt(p) { return p && p.length === 12 ? '+' + p.slice(0, 2) + ' ' + p.slice(2, 5) + ' ' + p.slice(5, 8) + ' ' + p.slice(8, 10) + ' ' + p.slice(10) : (p || ''); }
  function haptic(k) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} }

  // незбережений текст: питаємо перед закриттям
  function dirty() { return ['fNote', 'stWhy'].some(function (k) { var x = $('#' + k); return x && x.value.trim(); }) && $('#detail').classList.contains('show'); }
  function syncDirty() { try { if (!tg) return; if (dirty()) tg.enableClosingConfirmation && tg.enableClosingConfirmation(); else tg.disableClosingConfirmation && tg.disableClosingConfirmation(); } catch (e) {} }
  document.addEventListener('input', syncDirty);

  function api(action, p) {
    if (DEMO) return Promise.resolve(demo(action, p));
    if (GAS) return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(function (s) {
        var r = JSON.parse(s); if (r.ok) res(r.data); else rej(new Error(r.error || 'server'));
      }).withFailureHandler(function () { rej(new Error('server')); }).miniApi({ api: action, init: INIT, key: KEY, p: p ? JSON.stringify(p) : '' });
