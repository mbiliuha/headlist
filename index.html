<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Хед-лист</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2b7de9);
    --btn: var(--tg-theme-button-color, #2b7de9);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sep: color-mix(in srgb, var(--hint) 25%, transparent);
    --red: #e5484d; --yellow: #f5b400; --blue: #3b82f6; --green: #22a861; --gray: #a0a4ab;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text); font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { background: var(--bg); padding: 12px 16px 10px; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--sep); }
  .row { display: flex; align-items: center; gap: 8px; }
  .who { font-weight: 600; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select { font: inherit; color: var(--text); background: var(--bg2); border: 0; border-radius: 10px; padding: 6px 10px; max-width: 55%; }
  .stats { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .stat { background: var(--bg2); border-radius: 10px; padding: 5px 9px; font-size: 14px; white-space: nowrap; }
  .stat b { font-weight: 700; }
  .stat.bad b { color: var(--red); }
  .tabs { display: flex; background: var(--bg2); border-radius: 10px; padding: 3px; margin-top: 10px; }
  .tab { flex: 1; text-align: center; padding: 7px 4px; border-radius: 8px; font-size: 15px; font-weight: 500; color: var(--hint); border: 0; background: none; font-family: inherit; }
  .tab.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .banner { margin: 10px 12px 0; background: color-mix(in srgb, var(--btn) 14%, var(--bg)); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  .group { margin: 14px 0 0; }
  .gtitle { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--hint); padding: 0 16px 6px; display: flex; justify-content: space-between; }
  .gtitle.over { color: var(--red); }
  .list { background: var(--bg); border-top: 1px solid var(--sep); border-bottom: 1px solid var(--sep); }
  .item { display: flex; gap: 10px; padding: 11px 16px; align-items: flex-start; border-bottom: 1px solid var(--sep); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:active { background: var(--bg2); }
  .time { width: 48px; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .time.over { color: var(--red); }
  .time small { display: block; font-weight: 400; font-size: 12px; color: var(--hint); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--gray); }
  .s-yellow { background: var(--yellow); } .s-blue { background: var(--blue); } .s-white { background: #fff; box-shadow: inset 0 0 0 1.5px var(--gray); } .s-green { background: var(--green); } .s-red { background: var(--red); }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 14px; color: var(--hint); margin-top: 1px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sub a { color: var(--link); text-decoration: none; font-weight: 500; }
  .note { font-size: 14px; margin-top: 3px; color: var(--text); opacity: .8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { text-align: center; color: var(--hint); padding: 28px 16px; font-size: 15px; }
  .search { padding: 10px 12px 0; }
  .search input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--sep); border-radius: 12px; padding: 10px 12px; outline: none; }
  .chips { display: flex; gap: 6px; padding: 10px 12px 0; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--sep); background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; }
  .chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  /* картка бізнесу */
  #detail { position: fixed; inset: 0; background: var(--bg2); overflow-y: auto; z-index: 20; display: none; }
  #detail.show { display: block; }
  .dhead { background: var(--bg); padding: 14px 16px; border-bottom: 1px solid var(--sep); }
  .dhead h1 { font-size: 21px; margin: 0; line-height: 1.25; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 6px; padding: 3px 10px; border-radius: 999px; background: var(--bg2); }
  .next { margin-top: 8px; font-size: 15px; }
  .next.over { color: var(--red); font-weight: 600; }
  .sec { margin-top: 14px; }
  .sec h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--hint); margin: 0 16px 6px; font-weight: 500; }
  .card { background: var(--bg); border-top: 1px solid var(--sep); border-bottom: 1px solid var(--sep); padding: 4px 16px; }
  .field { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--sep); }
  .field:last-child { border-bottom: 0; }
  .field label { width: 74px; flex: none; color: var(--hint); font-size: 14px; }
  .field input, textarea { flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent; border: 0; outline: none; padding: 4px 0; }
  .callbtn { flex: none; background: var(--green); color: #fff; border-radius: 999px; padding: 6px 12px; text-decoration: none; font-size: 14px; font-weight: 600; }
  textarea { width: 100%; resize: none; min-height: 64px; padding: 10px 0; }
  .save { display: block; width: calc(100% - 32px); margin: 12px 16px 0; background: var(--btn); color: var(--btn-text); border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; }
  .save:disabled { opacity: .5; }
  .msg { margin: 8px 16px 0; font-size: 14px; color: var(--hint); min-height: 18px; }
  .msg.err { color: var(--red); }
  .ev { padding: 10px 0; border-bottom: 1px solid var(--sep); }
  .ev:last-child { border-bottom: 0; }
  .evh { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--hint); }
  .evh .dot { margin-top: 0; }
  .evt { font-size: 15px; margin-top: 3px; white-space: pre-wrap; word-wrap: break-word; }
  .evn { font-size: 14px; margin-top: 3px; color: var(--hint); white-space: pre-wrap; word-wrap: break-word; }
  .back { background: none; border: 0; color: var(--link); font: inherit; padding: 0 0 8px; display: none; }
  .noTg .back { display: inline-block; }
  .spin { text-align: center; padding: 40px; color: var(--hint); }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--bg2); color: var(--hint); }
  .tag.edit { background: color-mix(in srgb, var(--green) 18%, var(--bg)); color: var(--green); }
  .tag.off { text-decoration: line-through; }
  .mini { flex: none; border: 1px solid var(--sep); background: var(--bg); color: var(--red); border-radius: 10px; padding: 5px 10px; font: inherit; font-size: 14px; }
  .addbtn { display: block; width: calc(100% - 24px); margin: 10px 12px 0; background: var(--bg); color: var(--link); border: 1px dashed var(--sep); border-radius: 12px; padding: 11px; font: inherit; font-weight: 600; }
  .form { background: var(--bg); margin: 10px 12px 0; border-radius: 12px; padding: 4px 14px 12px; }
  .form .field label { width: 92px; }
  .form select { max-width: none; flex: 1; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 0; }
  .seg button { border: 1px solid var(--sep); background: var(--bg); color: var(--text); border-radius: 10px; padding: 7px 11px; font: inherit; font-size: 14px; }
  .seg button.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .form .save { width: 100%; margin: 10px 0 0; }
  .muted { opacity: .55; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row"><div class="who" id="who">Хед-лист</div><select id="agentSel" style="display:none"></select></div>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"><button class="tab on" data-tab="tasks">Наработки</button><button class="tab" data-tab="all">Усі бізнеси</button><button class="tab" data-tab="admin" id="tabAdmin" style="display:none">Доступи</button></div>
  </header>
  <div id="main"><div class="spin">Завантаження…</div></div>
</div>

<div id="detail"></div>

<script>
(function () {
  'use strict';
  // адреса Apps Script (веб-додаток бота)
  var API = 'https://script.google.com/macros/s/AKfycbz3pcpvLKDI_dqep5V_RSkmkxvB0Vv4DuGqLpmXa_ECrQNSVabpdt0Ecj5UAvsr6Qn9Yg/exec';
  var tg = window.Telegram && window.Telegram.WebApp;
  var DEMO = /[?&]demo=1/.test(location.search);
  // режим Apps Script: сторінка в iframe Google, initData беремо з адреси верхнього вікна
  var GAS = !!(window.google && google.script && google.script.run);
  var INIT = tg && tg.initData ? tg.initData : '';
  var KEY = '';   // персональний ключ із кнопки бота (Apps Script підставляє його сюди)
  if (!KEY) { var km = location.search.match(/[?&]k=([^&]+)/); if (km) KEY = decodeURIComponent(km[1]); }
  var S = { me: null, agent: null, data: null, tab: 'tasks', q: '', filter: '' };
  var ST = { green: 'Договір', red: 'Відпрацьовано', yellow: 'Думає', blue: 'Зустріч з ЛПР', white: 'Вийти на ЛПР', '': 'Без статусу' };
  function isOpenSt(s) { return s === 'yellow' || s === 'blue' || s === 'white'; }
  var WD = ['нд', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  if (!tg || !tg.initData) document.body.classList.add('noTg');
  function initFromHash(h) {
    var m = String(h || '').replace(/^#/, '').split('&').filter(function (kv) { return kv.indexOf('tgWebAppData=') === 0; })[0];
    return m ? decodeURIComponent(m.slice(13)) : '';
  }

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function d(dt) { return String(dt || '').slice(0, 10); }
  function t(dt) { return String(dt || '').slice(11, 16); }
  function dm(s) { var a = String(s).split('-'); return a[2] + '.' + a[1]; }
  function wd(s) { var a = s.split('-'); return WD[new Date(Date.UTC(+a[0], +a[1] - 1, +a[2])).getUTCDay()]; }
  function addDays(s, n) { var a = s.split('-'); var x = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2]) + n * 864e5); return x.toISOString().slice(0, 10); }
  function phoneFmt(p) { return p && p.length === 12 ? '+' + p.slice(0, 2) + ' ' + p.slice(2, 5) + ' ' + p.slice(5, 8) + ' ' + p.slice(8, 10) + ' ' + p.slice(10) : (p || ''); }
  function haptic(k) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} }

  function api(action, p) {
    if (DEMO) return Promise.resolve(demo(action, p));
    if (GAS) return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(function (s) {
        var r = JSON.parse(s); if (r.ok) res(r.data); else rej(new Error(r.error || 'server'));
      }).withFailureHandler(function () { rej(new Error('server')); }).miniApi({ api: action, init: INIT, key: KEY, p: p ? JSON.stringify(p) : '' });
    });
    var url = API + '?api=' + action + '&init=' + encodeURIComponent(INIT) + (KEY ? '&key=' + encodeURIComponent(KEY) : '') + (p ? '&p=' + encodeURIComponent(JSON.stringify(p)) : '');
    return fetch(url).then(function (r) { return r.json(); }).then(function (r) {
      if (!r.ok) throw new Error(r.error || 'server');   // коротке слово (auth/forbidden) або речення для людини
      return r.data;
    });
  }
  function errText(e) {
    var m = String(e && e.message || e);
    if (m === 'auth') return 'Відкрий застосунок через бота (кнопка «📱 Хед-лист»).';
    if (m === 'not_agent') return 'Тебе немає в списку агентів. Напиши менеджеру.';
    if (m === 'forbidden') return 'Немає доступу.';
    return 'Не вдалося завантажити. Перевір інтернет і спробуй ще раз.';
  }

  // ── завантаження ──
  function boot() {
    api('me').then(function (me) {
      S.me = me; S.agent = me.me.role === 'agent' ? me.me.username : (me.agents.filter(function (a) { return a.username !== me.me.username; })[0] || me.me).username;
      $('#who').textContent = me.me.role === 'agent' ? me.me.name : 'Команда';
      if (me.me.role !== 'agent' && me.agents.length) {
        var sel = $('#agentSel');
        sel.innerHTML = me.agents.filter(function (a) { return a.username !== me.me.username || me.agents.length === 1; })
          .map(function (a) { return '<option value="' + esc(a.username) + '">' + esc(a.name) + (a.level === 'edit' ? ' ✏️' : ' 👁') + '</option>'; }).join('');
        sel.value = S.agent; sel.style.display = '';
        sel.onchange = function () { S.agent = sel.value; load(); };
      }
      if (me.me.admin) $('#tabAdmin').style.display = '';
      if (!me.agents.length) { S.tab = 'admin'; document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x.dataset.tab === 'admin'); }); }
      if (me.agents.length) load(); else if (me.me.admin) render(); else $('#main').innerHTML = '<div class="empty">Доступу до даних агентів поки немає. Його видає власник.</div>';
    }).catch(function (e) { $('#main').innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  }
  function load() {
    $('#main').innerHTML = '<div class="spin">Завантаження…</div>';
    api('list', { agent: S.agent }).then(function (data) { S.data = data; render(); })
      .catch(function (e) { $('#main').innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  }

  // ── шапка ──
  function stats() {
    var x = S.data, n = x.norms, td = x.today, wk = x.week;
    var late = x.now.slice(11, 16) >= '17:00';
    function st(label, v, norm, alarm) { return '<span class="stat' + (late && v <= alarm ? ' bad' : '') + '">' + label + ' <b>' + v + '</b>/' + norm + '</span>'; }
    $('#stats').innerHTML = st('🚪', td.doors, n.doors, n.doorsAlarm) + st('🤝 ЛПР', td.lpr, n.lpr, n.lprAlarm) +
      '<span class="stat">⏱ ≥' + n.qualityMin + ' хв <b>' + td.quality + '</b></span>' +
      '<span class="stat">тиждень ЛПР <b>' + wk.lpr + '</b>/' + n.weekLpr + '</span>';
  }

  function row(b, timeCol) {
    var tm = '';
    if (timeCol) {
      var dd = d(b.next_dt), today = d(S.data.now);
      tm = '<div class="time' + (b.overdue ? ' over' : '') + '">' + (b.next_dt ? t(b.next_dt) : '—') +
        (dd && dd !== today ? '<small>' + wd(dd) + ' ' + dm(dd) + '</small>' : '') + '</div>';
    }
    var sub = [];
    if (b.lpr_name) sub.push(esc(b.lpr_name));
    if (b.lpr_phone) sub.push('<a href="tel:+' + esc(b.lpr_phone) + '" onclick="event.stopPropagation()">' + esc(phoneFmt(b.lpr_phone)) + '</a>');
    if (!timeCol && b.next_dt && isOpenSt(b.status)) sub.push((b.overdue ? '⏰ ' : '↪ ') + wd(d(b.next_dt)) + ' ' + dm(d(b.next_dt)) + ' ' + t(b.next_dt));
    if (b.next_kind === 'meeting' && timeCol) sub.push('зустріч');
    return '<div class="item" data-id="' + esc(b.id) + '">' + tm + '<span class="dot s-' + (b.status || 'none') + '"></span><div class="body">' +
      '<div class="name">' + esc(b.name) + '</div>' + (sub.length ? '<div class="sub">' + sub.join(' · ') + '</div>' : '') +
      (b.last_comment ? '<div class="note">' + esc(b.last_comment) + '</div>' : '') + '</div></div>';
  }
  function mixOf(list) {
    var n = {}; list.forEach(function (b) { n[b.status] = (n[b.status] || 0) + 1; });
    return [['blue', '🔵'], ['yellow', '🟡'], ['white', '⚪']].filter(function (x) { return n[x[0]]; }).map(function (x) { return x[1] + ' ' + n[x[0]]; }).join('  ');
  }
  function group(title, list, cls, timeCol) {
    if (!list.length) return '';
    var mx = mixOf(list);
    return '<div class="group"><div class="gtitle ' + (cls || '') + '"><span>' + title + '</span><span>' + (mx ? mx + '  ·  ' : '') + list.length + '</span></div><div class="list">' +
      list.map(function (b) { return row(b, timeCol); }).join('') + '</div></div>';
  }

  function render() {
    if (S.tab === 'admin') return renderAdmin();
    $('#agentSel').style.visibility = '';
    if (!S.data) return load();
    stats();
    var x = S.data, html = '';
    if (x.open) html += '<div class="banner">📌 Зараз у візиті з ' + t(x.open.start) + (x.open.bizName ? ': <b>' + esc(x.open.bizName) + '</b>' : '') + '</div>';
    if (S.tab === 'tasks') html += tasksView(); else html += allView();
    $('#main').innerHTML = html;
    var inp = $('#q');
    if (inp) { inp.value = S.q; inp.oninput = function () { S.q = inp.value; $('#allList').innerHTML = allList(); bindRows(); }; }
    document.querySelectorAll('.chip').forEach(function (c) { c.onclick = function () { S.filter = c.dataset.f; haptic(); render(); }; });
    bindRows();
  }
  function bindRows() { document.querySelectorAll('.item').forEach(function (el) { el.onclick = function () { openBiz(el.dataset.id); }; }); }

  function tasksView() {
    var x = S.data, today = d(x.now), tomorrow = addDays(today, 1);
    var open = x.businesses.filter(function (b) { return isOpenSt(b.status); });
    open.sort(function (a, b) { return String(a.next_dt || '9').localeCompare(String(b.next_dt || '9')); });
    var over = [], td = [], tm = [], later = [], nodate = [];
    open.forEach(function (b) {
      if (!b.next_dt) return nodate.push(b);
      var dd = d(b.next_dt);
      if (dd < today) over.push(b); else if (dd === today) td.push(b); else if (dd === tomorrow) tm.push(b); else later.push(b);
    });
    var h = group('⏰ Прострочено', over, 'over', true) + group('Сьогодні', td, '', true) + group('Завтра', tm, '', true) + group('Далі', later, '', true) + group('⚠️ Без дати', nodate, 'over', true);
    return h || '<div class="empty">Наработок немає. Час на нові двері 🚪</div>';
  }
  function allView() {
    var c = function (f, l) { return '<button class="chip' + (S.filter === f ? ' on' : '') + '" data-f="' + f + '">' + l + '</button>'; };
    return '<div class="search"><input id="q" type="search" placeholder="Пошук: назва, ЛПР, телефон"></div>' +
      '<div class="chips">' + c('', 'Усі') + c('yellow', '🟡 Думає') + c('blue', '🔵 Зустріч') + c('white', '⚪ Вийти на ЛПР') + c('green', '🟢 Договір') + c('red', '🔴 Відпрац.') + '</div>' +
      '<div class="group"><div class="list" id="allList">' + allList() + '</div></div>';
  }
  function allList() {
    var q = S.q.toLowerCase().trim(), qd = q.replace(/\D/g, '');
    var l = S.data.businesses.filter(function (b) {
      if (S.filter && b.status !== S.filter) return false;
      if (!q) return true;
      return (b.name + ' ' + b.lpr_name).toLowerCase().indexOf(q) >= 0 || (qd.length >= 3 && String(b.lpr_phone).indexOf(qd) >= 0);
    });
    return l.length ? l.map(function (b) { return row(b, false); }).join('') : '<div class="empty">Нічого не знайдено</div>';
  }

  // ── картка бізнесу ──
  var KIND = { visit: '🚪', call: '📞', message: '💬', note: '📝', status: '🔄' };
  function openBiz(id) {
    haptic();
    var el = $('#detail');
    el.innerHTML = '<div class="spin">Завантаження…</div>'; el.classList.add('show'); el.scrollTop = 0;
    if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeBiz); }
    api('biz', { id: id }).then(function (r) { renderBiz(r); }).catch(function (e) { el.innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  }
  function closeBiz() {
    $('#detail').classList.remove('show');
    if (tg && tg.BackButton) { tg.BackButton.hide(); tg.BackButton.offClick(closeBiz); }
  }
  function renderBiz(r) {
    var b = r.business, ed = r.editable, el = $('#detail');
    var next = '';

  } else boot();
})();
</script>
