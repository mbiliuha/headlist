<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; img-src 'self' data:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Хед-лист</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111);

    --btn-text: var(--tg-theme-button-text-color, #ffffff);

  }
  @supports (color: color-mix(in srgb, red 50%, blue)) {

  }
  :root.dark { --red-t: #ff6b6e; --green-t: #3dd68c; --blue-t: #6ea8ff; --amber-t: #ffc53d; --call: #1a7f55; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text); font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: var(--sab); overscroll-behavior-y: none; }
  body.lock { overflow: hidden; }
  ::placeholder { color: var(--hint); opacity: 1; }
  button, .tab, .chip, a.rcall, a.callbtn { touch-action: manipulation; }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { background: var(--bg); padding: 12px 16px 8px; }
  .tabsbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 12px 8px; border-bottom: 1px solid var(--sep); }
  .row { display: flex; align-items: center; gap: 8px; }
  .who { font-weight: 600; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select { font: inherit; color: var(--text); background: var(--bg2); border: 0; border-radius: 10px; padding: 10px 10px; min-height: 44px; max-width: 60%; }
  .stats { display: flex; gap: 6px; margin-top: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .stats::-webkit-scrollbar { display: none; }
  .stat { background: var(--bg2); border-radius: 10px; padding: 5px 9px; font-size: 14px; white-space: nowrap; }
  .stat b { font-weight: 700; }
  .stat.bad b { color: var(--red-t); }
  .tabs { display: flex; background: var(--bg2); border-radius: 10px; padding: 3px; }
  .tab { flex: 1; text-align: center; padding: 9px 4px; min-height: 40px; white-space: nowrap; border-radius: 8px; font-size: 15px; font-weight: 500; color: var(--text2); border: 0; background: none; font-family: inherit; }
  .tab.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  /* панель «Команда» */
  .who.bk { color: var(--link); cursor: pointer; }
  .hdbtn { flex: none; border: 1px solid var(--sep); background: var(--bg); color: var(--link); border-radius: 10px; padding: 6px 12px; min-height: 36px; font: inherit; font-size: 14px; }
  .tsum { padding: 10px 16px 0; font-size: 14px; color: var(--text2); }

  .ochips::-webkit-scrollbar { display: none; }

  .ochips button.on { background: var(--link); color: #fff; font-weight: 600; }
  .tsum b.g, .gl .g { color: var(--green-t); } .tsum b.r, .gl .r { color: var(--red-t); }
  .ring { position: relative; flex: none; }

  .ring circle { fill: none; stroke-width: 3.6; } .ring .rb { stroke: var(--sep); } .ring .rf { stroke-linecap: round; }
  .ring .rl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
  .ring .rl b { font-size: 19px; } .ring .rl span { font-size: 11px; color: var(--text2); }
  .ocard { margin: 10px 12px; padding: 14px; border-radius: 16px; background: var(--bg); cursor: pointer; }
  .ocard .otop { display: flex; gap: 12px; align-items: center; }
  .ocard .oinfo { flex: 1; min-width: 0; } .ocard .on { font-weight: 700; font-size: 17px; }
  .ocard .od { font-size: 13px; color: var(--text2); margin-top: 1px; } .ocard .os { font-size: 13px; margin-top: 3px; }
  .ocard .chev { color: var(--text2); font-size: 22px; }
  .oav { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
  .oav::-webkit-scrollbar { display: none; }

  .av i { width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--gray); display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 700; background: var(--bg2); }
  .av.in i { border-color: var(--green); } .av.ov i { border-color: var(--red); } .av.wk i { border-color: var(--blue); }
  .av div { font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .av small { font-size: 11px; color: var(--text2); }
  .olegend { margin: 2px 16px 14px; font-size: 12px; color: var(--text2); }
  .gbox { margin: 8px 12px; padding: 2px 12px; border-radius: 14px; background: var(--bg); }
  .grow { padding: 10px 0; border-bottom: 1px solid var(--sep); cursor: pointer; } .grow:last-of-type { border-bottom: 0; }
  .grow:active { opacity: .7; }

  .grow .gt { font-size: 13px; white-space: nowrap; color: var(--text2); } .grow .gt .g { color: var(--green-t); font-weight: 600; } .grow .gt .r { color: var(--red-t); font-weight: 600; }

  .q-green { background: var(--green); } .q-yellow { background: var(--yellow); } .q-blue { background: var(--blue); } .q-red { background: var(--red); } .q-white, .q- { background: var(--gray); }
  .q-e { border: 1.5px dashed var(--sep); }
  .q-now { background: color-mix(in srgb, var(--green) 25%, transparent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--green); margin: 0 3px; animation: qp 1.6s ease-in-out infinite; }
  @keyframes qp { 50% { opacity: .45; } }
  .gpz { display: flex; align-items: center; gap: 3px; color: var(--red-t); font-size: 11px; font-weight: 600; padding: 0 2px; white-space: nowrap; }
  .gpz::before, .gpz::after { content: ''; width: 12px; border-top: 2px dotted var(--red); opacity: .7; }
  .glegend { font-size: 11.5px; color: var(--text2); padding: 8px 0 10px; border-top: 1px solid var(--sep); }
  .tcard { margin: 8px 12px; padding: 11px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--sep); cursor: pointer; }
  .tcard:active { opacity: .7; }
  .tcard .tn { display: flex; gap: 8px; align-items: baseline; font-weight: 600; font-size: 16px; }
  .tcard .tn span:first-child { flex: 1; min-width: 0; }
  .tcard .tl { font-size: 13px; color: var(--text2); font-weight: 400; white-space: nowrap; }
  .tcard .tin { margin-top: 4px; font-size: 14px; color: var(--link); }
  .tcard .tc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .tcard .tc span { background: var(--bg2); border-radius: 8px; padding: 3px 8px; font-size: 13px; white-space: nowrap; }
  .tcard .tc .bad { color: var(--red-t); font-weight: 600; }
  .tcard .tc .ok { color: var(--green-t, #18794e); font-weight: 600; }
  .tcard.idle { opacity: .6; padding: 9px 12px; }
  .tgrp { padding: 14px 16px 2px; font-size: 13px; color: var(--text2); text-transform: uppercase; letter-spacing: .3px; }
  .banner { margin: 10px 12px 0; background: rgba(43,125,233,.14); background: color-mix(in srgb, var(--btn) 14%, var(--bg)); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  .group { margin: 14px 0 0; }
  .gtitle { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--text2); padding: 0 16px 6px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .gtitle span:first-child { white-space: nowrap; font-weight: 600; }
  .gtitle.over span:first-child { color: var(--red-t); }
  .list { background: var(--bg); border-top: 1px solid var(--sep); border-bottom: 1px solid var(--sep); }

  .item:last-child { border-bottom: 0; }
  .item:active { background: var(--bg2); }

  .time.over { color: var(--red-t); }
  .time small { display: block; font-weight: 400; font-size: 13px; color: var(--text2); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-top: 5px; background: var(--gray); }
  .s-yellow { background: var(--yellow); } .s-blue { background: var(--blue); } .s-white { background: #fff; box-shadow: inset 0 0 0 1.5px var(--gray); } .s-green { background: var(--green); } .s-red { background: var(--red); }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .sub { font-size: 14px; color: var(--text2); margin-top: 2px; line-height: 1.4; }

  .rcall:active { opacity: .6; }
  .qd { color: var(--amber-t); font-weight: 600; }

  .empty { text-align: center; color: var(--text2); padding: 28px 16px; font-size: 15px; }
  .search { padding: 10px 12px 0; }
  .search input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--sep); border-radius: 12px; padding: 11px 12px; min-height: 44px; outline: none; }
  .chips { display: flex; gap: 8px; padding: 10px 12px 0; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--sep); background: var(--bg); color: var(--text); border-radius: 999px; padding: 10px 14px; min-height: 42px; font: inherit; font-size: 14px; }
  .chip small { opacity: .7; font-size: 13px; margin-left: 2px; }
  .chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  /* картка бізнесу */
  #detail { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg2); overflow-y: auto; z-index: 20; display: none; padding-bottom: calc(var(--sab) + 24px); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #detail.show { display: block; }
  .dhead { background: var(--bg); padding: 14px 16px; border-bottom: 1px solid var(--sep); }
  .dhead h1 { font-size: 21px; margin: 0; line-height: 1.25; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 6px; padding: 3px 10px; border-radius: 999px; background: var(--bg2); }
  .next { margin-top: 8px; font-size: 15px; }
  .next.over { color: var(--red-t); font-weight: 600; }
  .sec { margin-top: 14px; }
  .sec h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--text2); margin: 0 16px 6px; font-weight: 500; }
  .card { background: var(--bg); border-top: 1px solid var(--sep); border-bottom: 1px solid var(--sep); padding: 4px 16px; }
  .field { display: flex; align-items: center; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--sep); }
  .field:last-child { border-bottom: 0; }
  .field label { width: 5.3em; flex: none; color: var(--text2); font-size: 14px; }
  .field input, textarea { flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent; border: 0; outline: none; padding: 11px 0; text-overflow: ellipsis; }
  .callbtn { flex: none; background: var(--call); color: #fff; border-radius: 999px; padding: 11px 16px; text-decoration: none; font-size: 15px; font-weight: 600; }
  textarea { width: 100%; resize: none; min-height: 64px; padding: 10px 0; }
  .save { display: block; width: calc(100% - 32px); margin: 12px 16px 0; background: var(--btn); color: var(--btn-text); border: 0; border-radius: 12px; padding: 14px 12px; min-height: 48px; font: inherit; font-weight: 600; }
  .save:disabled { opacity: .5; }
  .save:active, .callbtn:active { filter: brightness(.88); }
  .tab:active, .chip:active, .seg button:active, .daynav button:active, .mini:active, .addbtn:active { opacity: .6; }
  .msg { margin: 8px 16px 0; font-size: 14px; color: var(--text2); min-height: 18px; }
  .msg.err { color: var(--red-t); }
  .ev { padding: 10px 0; border-bottom: 1px solid var(--sep); }
  .ev:last-child { border-bottom: 0; }
  .evh { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text2); }
  .evh .dot { margin-top: 0; }
  .evt { font-size: 15px; line-height: 1.4; margin-top: 3px; white-space: pre-wrap; word-wrap: break-word; }
  .evn { font-size: 14px; margin-top: 3px; color: var(--text2); white-space: pre-wrap; word-wrap: break-word; }

  .dsum { display: flex; gap: 8px; align-items: flex-start; }

  .lrow { display: flex; gap: 10px; padding: 6px 16px 6px 20px; border-bottom: 1px solid var(--sep); cursor: pointer; font-size: 13px; color: var(--text2); }

  .lrow .bd { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
  .lrow b { color: var(--text); font-weight: 600; }
  .dsum .st { flex: 1; min-width: 0; }
  .ord { flex: none; border: 1px solid var(--sep); background: var(--bg); color: var(--link); border-radius: 10px; padding: 6px 10px; min-height: 36px; font: inherit; font-size: 13px; white-space: nowrap; }

  .dflt button.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
