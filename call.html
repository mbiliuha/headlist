<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дзвінок</title>
<style>body{margin:0;font:18px -apple-system,system-ui,sans-serif;background:#f2f2f7;color:#111;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
a{display:inline-block;margin-top:16px;padding:18px 28px;border-radius:14px;background:#34c759;color:#fff;text-decoration:none;font-weight:600;font-size:22px}
p{color:#666;font-size:15px;margin:14px 16px}
@media (prefers-color-scheme:dark){body{background:#000;color:#fff}p{color:#999}}</style></head>
<body><div><div id="num"></div><a id="go" href="#">📞 Подзвонити</a><p>Після дзвінка поверніться в Telegram.</p></div>
<script>
var n = (new URLSearchParams(location.search).get('n') || '').replace(/\D/g, '');
var tel = 'tel:+' + n, el = document.getElementById('go');
document.getElementById('num').textContent = n.length === 12 ? '+' + n.slice(0,2) + ' ' + n.slice(2,5) + ' ' + n.slice(5,8) + ' ' + n.slice(8,10) + ' ' + n.slice(10) : '+' + n;
el.href = tel;
if (n) setTimeout(function () { location.href = tel; }, 150);
</script></body></html>
